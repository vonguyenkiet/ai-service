name: AI Service CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Contract validation
        run: python scripts/validate_ai_contract.py

      - name: Tests
        run: pytest

      - name: Baseline smoke evaluation
        run: python -m evaluation.run_classification

      - name: Python compile check
        run: python -m compileall -q src evaluation scripts

      - name: Verify canonical backend contract bytes
        run: |
          python - <<'PY'
          import hashlib
          import json
          import urllib.request

          lock = json.load(open("contract.lock.json", encoding="utf-8"))
          url = (
              f"https://raw.githubusercontent.com/"
              f"{lock['sourceRepository']}/{lock['sourceRef']}/{lock['path']}"
          )
          content = urllib.request.urlopen(url, timeout=30).read()
          assert hashlib.sha256(content).hexdigest() == lock["sha256"]
          PY

  docker:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - name: Build non-root runtime image
        run: docker build -t supportflow-ai-service:${{ github.sha }} .
