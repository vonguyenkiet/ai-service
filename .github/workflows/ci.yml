name: AI Service CI

on:
  push:
    branches: [main, ai-service, 'devops/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Contract validation
        run: python scripts/validate_ai_contract.py

      - name: Tests
        run: pytest

      - name: Baseline smoke evaluation
        run: python -m evaluation.run_classification

      - name: Python compile check
        run: python -m compileall -q src evaluation scripts

      - name: Verify canonical backend contract bytes
        run: |
          python - <<'PY'
          import hashlib
          import json
          import urllib.request

          lock = json.load(open("contract.lock.json", encoding="utf-8"))
          url = (
              f"https://raw.githubusercontent.com/"
              f"{lock['sourceRepository']}/{lock['sourceRef']}/{lock['path']}"
          )
          content = urllib.request.urlopen(url, timeout=30).read()
          assert hashlib.sha256(content).hexdigest() == lock["sha256"]
          PY

  docker:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - name: Build non-root runtime image
        run: docker build -t servicedesk-ai-service:ci .

  publish:
    name: Publish GHCR image
    runs-on: ubuntu-latest
    needs: docker
    if: github.repository_owner == 'supportflow-ai' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/ai-service' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/devops/'))
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build and push AI service image
        id: build-ai
        run: |
          IMAGE="ghcr.io/supportflow-ai/servicedesk-ai-service:sha-${{ github.sha }}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE" 2>/dev/null | awk -F'@' '{print $2}')
          echo "ai_digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "AI Service Digest: $DIGEST"
      - name: Record published AI service artifact digest
        run: |
          mkdir -p artifacts/ghcr
          cat <<EOF > artifacts/ghcr/ai-service-digest.json
          {
            "repository": "${{ github.repository }}",
            "commit": "${{ github.sha }}",
            "ref": "${{ github.ref }}",
            "publishedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "images": {
              "aiService": "ghcr.io/supportflow-ai/servicedesk-ai-service@${{ steps.build-ai.outputs.ai_digest }}"
            }
          }
          EOF
          cat artifacts/ghcr/ai-service-digest.json
      - uses: actions/upload-artifact@v4
        with:
          name: ai-service-ghcr-digest-${{ github.sha }}
          path: artifacts/ghcr/ai-service-digest.json
